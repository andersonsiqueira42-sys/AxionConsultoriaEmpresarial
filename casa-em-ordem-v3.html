<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}html,body{margin:0}</style>
<title>Casa em Ordem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fixa + área de trabalho; no celular a navegação vira uma faixa rolável no topo. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface2:#F5F8F7; --ink:#12201C; --ink2:#4B5C57; --line:#D6DFDB;
  --accent:#27478F; --accent-ink:#FFFFFF; --accent-soft:#E3E9F7;
  --in:#1B7F4B; --in-bg:#DFF3E7; --out:#B4402F; --out-bg:#F8E2DD; --warn:#946000; --warn-bg:#FBEFCF;
  --shadow:0 1px 2px rgba(18,32,28,.06),0 6px 20px rgba(18,32,28,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#16211E; --surface2:#1B2825; --ink:#E7EFEB; --ink2:#9CAFA8; --line:#2A3A35;
  --accent:#8FADF2; --accent-ink:#0E1614; --accent-soft:#222F4D;
  --in:#5CCB8E; --in-bg:#17372A; --out:#F29484; --out-bg:#44211B; --warn:#E8B655; --warn-bg:#40320F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#16211E; --surface2:#1B2825; --ink:#E7EFEB; --ink2:#9CAFA8; --line:#2A3A35;
  --accent:#8FADF2; --accent-ink:#0E1614; --accent-soft:#222F4D;
  --in:#5CCB8E; --in-bg:#17372A; --out:#F29484; --out-bg:#44211B; --warn:#E8B655; --warn-bg:#40320F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding-inline:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.in{color:var(--in)} .out{color:var(--out)} .warn{color:var(--warn)} .muted{color:var(--ink2)}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{font:700 20px/1.1 var(--f-display);letter-spacing:-.01em;padding:0 10px}
.brand small{display:block;font:400 11px var(--f-body);color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:9px 10px;text-align:left;color:var(--ink2);font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg,.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side .foot{margin-top:auto;font-size:12px;color:var(--ink2);padding:0 10px}
.main{padding:24px 28px 56px;min-width:0;max-width:1180px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font:700 28px/1.1 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:700 16px/1.2 var(--f-display);margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.in-b{background:var(--in-bg);border-color:transparent;color:var(--in)}
.btn.out-b{background:var(--out-bg);border-color:transparent;color:var(--out)}
.btn.danger{color:var(--out)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{position:relative}
.dot{background:var(--out);color:var(--accent-ink);border-radius:99px;font-size:11px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px;font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel.flat{box-shadow:none}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kpi{padding:16px 18px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.kpi .big{font:500 26px/1.2 var(--f-mono);margin:6px 0 8px;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .sub{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--out-bg);color:var(--out);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:500}
.empty{background:var(--accent-soft);border-radius:12px;padding:20px;margin-bottom:16px;display:grid;gap:10px}
.empty h2{font-size:18px}
.monthnav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px}
.monthnav button{border:0;background:none;border-radius:6px;padding:6px 10px}
.monthnav button:hover{background:var(--surface2)}
.monthnav span{min-width:120px;text-align:center;font-weight:600}
.monthnav span::first-letter{text-transform:uppercase}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink2);margin:6px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.hb{display:grid;gap:10px;margin-top:12px}
.hb .r{display:grid;gap:4px}
.hb .t{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.hb .t span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .b{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.hb .b i{display:block;height:100%;background:var(--accent);border-radius:99px}
.list{display:grid;margin-top:8px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .d{font:500 12px var(--f-mono);text-align:center;border-radius:6px;padding:4px 6px;background:var(--surface2);min-width:50px}
.li .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.filters label,.fld{display:grid;gap:4px;font-size:12px;color:var(--ink2);letter-spacing:.03em}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.filters input,.filters select{width:auto;min-width:130px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font:600 11.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:12.5px;color:var(--ink2)}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-aberto{background:var(--accent-soft);color:var(--accent)}
.p-vencido{background:var(--out-bg);color:var(--out)}
.p-hoje{background:var(--warn-bg);color:var(--warn)}
.p-baixado{background:var(--in-bg);color:var(--in)}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.tot{display:flex;gap:20px;flex-wrap:wrap;justify-content:flex-end;padding:12px 4px;font-size:13px;color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.t button[aria-pressed="true"][data-v="receber"]{background:var(--in);color:var(--accent-ink)}
.seg.t button[aria-pressed="true"][data-v="pagar"]{background:var(--out);color:var(--accent-ink)}

.ov{position:fixed;inset:0;background:rgba(8,14,12,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{width:min(900px,100%)}
.mh{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:18px 20px 8px}
.mb{padding:8px 20px 20px;display:grid;gap:14px}
.mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:6px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.hint{font-size:12.5px;color:var(--ink2)}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--ink2);padding:2px 8px;border-radius:6px}
.rem{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rem h3{font:700 15px var(--f-display);margin:0 0 4px;display:flex;justify-content:space-between;gap:8px}
.grp{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin:12px 0 2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.cadgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px;align-items:start}
.cadrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cadrow>div:first-child{min-width:0}
.cadrow b{font-weight:500}
.svgc{width:100%;height:auto;display:block}
.svgc text{fill:var(--ink2);font:11px var(--f-mono)}
.svgc line{stroke:var(--line)}

@media (max-width:1020px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}.g3,.cadgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:8px;z-index:20;top:env(safe-area-inset-top,0px);border-right:0;border-bottom:1px solid var(--line)}
  .brand{display:none}.side .foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;min-width:0}
  .nav button{white-space:nowrap}
  .main{padding:16px 16px 48px}
  .g2,.rem,.row2,.row3{grid-template-columns:minmax(0,1fr)}
  h1{font-size:24px}
}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr)}.kpi{border-left:0!important;border-top:1px solid var(--line)}.kpi:first-child{border-top:0}}
body,.side,.panel,.tw,.modal,.kpis,.btn,input,select,textarea{transition:background-color .2s,color .2s,border-color .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand">Casa em Ordem<small>Gestão financeira doméstica</small></div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="foot" id="syncinfo"></div>
  </aside>
  <main class="main" id="main" aria-live="polite"></main>
</div>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(Math.round((v||0)*100)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const parts=s=>s.split('-').map(Number);
const fmtD=s=>s?s.split('-').reverse().join('/'):'';
const addDays=(s,n)=>{const [y,m,d]=parts(s);return iso(new Date(y,m-1,d+n))};
const addMonths=(s,n)=>{const [y,m,d]=parts(s);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return iso(t)};
const monthOf=s=>s.slice(0,7);
const monthLabel=m=>{const [y,mm]=parts(m);return new Date(y,mm-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const monthShort=m=>{const [y,mm]=parts(m);return new Date(y,mm-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'/'+String(y).slice(2)};
const shiftMonth=(m,n)=>addMonths(m+'-01',n).slice(0,7);
const lastDay=m=>{const [y,mm]=parts(m);return iso(new Date(y,mm,0))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const parseBR=s=>{s=String(s||'').trim().replace(/[R$\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s)};
const sum=a=>a.reduce((t,x)=>t+(x.v!=null?x.v:x),0);
const cents=v=>Math.round(v*100);

const ICONS={
 dash:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
 pagar:'<path d="M7 17 17 7M8 7h9v9"/>',
 receber:'<path d="M17 7 7 17M16 17H7V8"/>',
 lanc:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 extrato:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 13h6M9 17h6"/>',
 cad:'<path d="M4 7h16M4 12h16M4 17h10"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
 auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
 bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/>'
};
const ico=n=>'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>';

/* ---------- dados e persistência ---------- */
const COLS=['contas','centros','carteiras','lanc','fornecedores','formas'];
const LS='casaemordem.v1';
let S={contas:[],centros:[],carteiras:[],lanc:[],fornecedores:[],formas:[]};
let DB=null, syncMode='local';
const lsSave=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const lsLoad=()=>{try{const r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}};
let warned=false;
const dbFail=()=>{if(!warned){warned=true;toast('Não foi possível gravar na nuvem. Os dados ficaram salvos neste navegador.')}};
async function put(col,item){
  const i=S[col].findIndex(x=>x.id===item.id); if(i>=0)S[col][i]=item; else S[col].push(item);
  lsSave();
  if(DB){try{await DB.collection(col).doc(item.id).set(item)}catch(e){dbFail()}}
}
async function putMany(col,items){
  items.forEach(item=>{const i=S[col].findIndex(x=>x.id===item.id); if(i>=0)S[col][i]=item; else S[col].push(item)});
  lsSave();
  if(DB){try{await Promise.all(items.map(item=>DB.collection(col).doc(item.id).set(item)))}catch(e){dbFail()}}
}
async function del(col,ids){
  ids=[].concat(ids); S[col]=S[col].filter(x=>!ids.includes(x.id)); lsSave();
  if(DB){try{await Promise.all(ids.map(id=>DB.collection(col).doc(id).delete()))}catch(e){dbFail()}}
}
async function loadAll(){
  const local=lsLoad();
  try{ if(window.claude&&window.claude.use) DB=await window.claude.use('db'); }catch(e){DB=null}
  if(DB){
    try{
      const res=await Promise.all(COLS.map(c=>DB.collection(c).get()));
      const n={};COLS.forEach((c,i)=>n[c]=res[i].docs.map(d=>d.data()));
      const has=COLS.some(c=>n[c].length);
      if(has){S=n;lsSave()}
      else if(local&&COLS.some(c=>(local[c]||[]).length)){
        COLS.forEach(c=>S[c]=local[c]||[]);
        for(const c of COLS){await Promise.all(S[c].map(x=>DB.collection(c).doc(x.id).set(x)))}
        toast('Dados deste navegador enviados para a nuvem.');
      }
      syncMode='nuvem';
    }catch(e){DB=null;syncMode='local';if(local)COLS.forEach(c=>S[c]=local[c]||[])}
  } else if(local){COLS.forEach(c=>S[c]=local[c]||[])}
  if(!DB)syncMode='local';
}

/* ---------- regras ---------- */
const st=l=>{if(l.status==='baixado')return 'baixado';const t=today();return l.venc<t?'vencido':l.venc===t?'hoje':'aberto'};
const stLabel=(l)=>{const s=st(l);return s==='baixado'?(l.tipo==='pagar'?'Pago':'Recebido'):s==='vencido'?'Vencida':s==='hoje'?'Vence hoje':(l.tipo==='pagar'?'A pagar':'A receber')};
const nome=(col,id,k='nome')=>{const x=S[col].find(y=>y.id===id);return x?x[k]:''};
const contaNome=id=>{const c=S.contas.find(x=>x.id===id);return c?(c.codigo?c.codigo+' ':'')+c.nome:'Sem conta'};
const nl=n=>n+(n===1?' lançamento':' lançamentos');
const pessoaNome=l=>{const f=S.fornecedores.find(x=>x.id===l.fornecedorId);return f?f.nome:(l.pessoa||'')};
const formaNome=l=>nome('formas',l.formaId);
const FORMAS_PADRAO=['PIX','Dinheiro','Cartão de crédito','Cartão de débito','TED','Boleto','Cheque','Outro'];
async function ensureDefaults(){
  if(!S.formas.length)await putMany('formas',FORMAS_PADRAO.map((nome,i)=>({id:uid()+'f'+i,nome})));
}
async function resolveForn(nm,tipo){
  nm=(nm||'').trim();if(!nm)return '';
  let f=S.fornecedores.find(x=>x.nome.toLowerCase()===nm.toLowerCase());
  const need=tipo==='pagar'?'fornecedor':'cliente';
  if(!f){f={id:uid(),nome:nm,tipo:need};await put('fornecedores',f)}
  else if(f.tipo!==need&&f.tipo!=='ambos'){f=Object.assign({},f,{tipo:'ambos'});await put('fornecedores',f)}
  return f.id;
}
async function syncFornecedores(){
  const by={};S.fornecedores.forEach(f=>by[f.nome.toLowerCase()]=f);
  const nf=[],chg=[];
  S.lanc.forEach(l=>{
    const nm=(l.pessoa||'').trim();if(!nm||l.fornecedorId)return;
    const need=l.tipo==='pagar'?'fornecedor':'cliente';let f=by[nm.toLowerCase()];
    if(!f){f={id:uid()+'n'+nf.length,nome:nm,tipo:need};if(l.exemplo)f.exemplo=true;by[nm.toLowerCase()]=f;nf.push(f)}
    else{
      if(f.tipo!==need&&f.tipo!=='ambos'){f.tipo='ambos';if(!nf.includes(f))nf.push(f)}
      if(f.exemplo&&!l.exemplo){delete f.exemplo;if(!nf.includes(f))nf.push(f)}
    }
    l.fornecedorId=f.id;chg.push(l);
  });
  if(nf.length)await putMany('fornecedores',nf);
  if(chg.length)await putMany('lanc',chg);
}
const valorReal=l=>l.status==='baixado'?(l.valorBaixa!=null?l.valorBaixa:l.valor):l.valor;
const abertas=l=>l.status!=='baixado';
function saldoCarteira(c){
  let s=c.saldoInicial||0;
  S.lanc.forEach(l=>{if(l.status==='baixado'&&l.carteiraId===c.id)s+=(l.tipo==='receber'?1:-1)*valorReal(l)});
  return s;
}
function splitCents(total,n){const t=cents(total),b=Math.floor(t/n),r=t-b*n;return Array.from({length:n},(_,i)=>(b+(i<r?1:0))/100)}
function nextDate(base,i,per){return per==='semanal'?addDays(base,7*i):per==='quinzenal'?addDays(base,15*i):per==='anual'?addMonths(base,12*i):addMonths(base,i)}

/* ---------- tema claro / escuro ---------- */
const TEMA_KEY='casaemordem.tema';
const TEMAS=['auto','light','dark'];
const TEMA_LBL={auto:'Automático',light:'Claro',dark:'Escuro'};
const TEMA_ICO={auto:'auto',light:'sun',dark:'moon'};
let tema='auto';
try{const t=localStorage.getItem(TEMA_KEY);if(TEMAS.includes(t))tema=t}catch(e){}
function applyTema(){
  const r=document.documentElement;
  if(tema==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',tema);
  document.querySelectorAll('[data-act="tema"]').forEach(b=>{
    b.innerHTML=ico(TEMA_ICO[tema])+'<span>Tema: '+TEMA_LBL[tema]+'</span>';
    b.title='Alternar entre automático, claro e escuro';
  });
}
function cycleTema(){
  tema=TEMAS[(TEMAS.indexOf(tema)+1)%TEMAS.length];
  try{localStorage.setItem(TEMA_KEY,tema)}catch(e){}
  applyTema();toast('Tema '+TEMA_LBL[tema].toLowerCase()+'.');
}

/* ---------- Painel ---------- */
function barChart(months,inV,outV){
  const W=640,H=230,L=52,R=8,T=10,B=28,pw=W-L-R,ph=H-T-B;
  const mx=Math.max(1,...inV,...outV);
  const mag=Math.pow(10,Math.floor(Math.log10(mx)));let step=mag;[1,2,2.5,5,10].some(k=>{step=mag*k/ (k===10?1:1)*(k===10?1:1);return mx/(mag*k)<=4});
  const cand=[1,2,2.5,5,10].map(k=>mag*k).find(s=>mx/s<=4)||mag*10;step=cand;
  const top=Math.ceil(mx/step)*step;
  const y=v=>T+ph-(v/top)*ph;
  const fk=v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(Math.round(v));
  let g='';
  for(let v=0;v<=top+0.001;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fk(v)}</text>`}
  const gw=pw/months.length,bw=Math.min(26,gw/3);
  months.forEach((m,i)=>{
    const cx=L+gw*i+gw/2;
    const sel=m===dm;
    g+=`<rect x="${cx-bw-1}" y="${y(inV[i])}" width="${bw}" height="${Math.max(0,T+ph-y(inV[i]))}" rx="3" fill="var(--in)"><title>Receitas ${monthShort(m)}: ${brl(inV[i])}</title></rect>`;
    g+=`<rect x="${cx+1}" y="${y(outV[i])}" width="${bw}" height="${Math.max(0,T+ph-y(outV[i]))}" rx="3" fill="var(--out)"><title>Despesas ${monthShort(m)}: ${brl(outV[i])}</title></rect>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" ${sel?'style="fill:var(--ink);font-weight:500"':''}>${monthShort(m)}</text>`;
  });
  return `<svg class="svgc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas dos últimos seis meses">${g}</svg>`;
}
function hbars(items,color){
  if(!items.length)return '<p class="hint">Sem lançamentos de despesa neste mês.</p>';
  const mx=Math.max(...items.map(i=>i.v));
  return `<div class="hb">${items.map(i=>`<div class="r"><div class="t"><span>${esc(i.k)}</span><span class="num">${brl(i.v)}</span></div><div class="b"><i style="width:${Math.max(3,i.v/mx*100)}%${color?';background:'+color:''}"></i></div></div>`).join('')}</div>`;
}
function groupBy(arr,keyFn,labelFn){
  const m={};arr.forEach(l=>{const k=keyFn(l)||'—';m[k]=(m[k]||0)+l.valor});
  return Object.entries(m).map(([k,v])=>({k:labelFn(k),v})).sort((a,b)=>b.v-a.v).slice(0,6);
}

/* ---------- Listas ---------- */
function filtered(v){
  const f=F[v],t=today();
  return S.lanc.filter(l=>{
    if(v==='pagar'||v==='receber'){if(l.tipo!==v)return false}
    else if(f.tipo&&l.tipo!==f.tipo)return false;
    const s=st(l);
    if(f.status==='abertas'&&s==='baixado')return false;
    if(f.status==='vencidas'&&s!=='vencido')return false;
    if(f.status==='baixadas'&&s!=='baixado')return false;
    if(f.mes){const d=(s==='baixado'&&f.status==='baixadas')?l.dataBaixa:l.venc;if(!d||monthOf(d)!==f.mes)return false}
    if(f.centro&&l.centroId!==f.centro)return false;
    if(f.forma&&l.formaId!==f.forma)return false;
    if(f.q){const q=f.q.toLowerCase();if(!((l.descricao||'')+' '+pessoaNome(l)+' '+contaNome(l.contaId)).toLowerCase().includes(q))return false}
    return true;
  }).sort((a,b)=>a.venc.localeCompare(b.venc)||a.descricao.localeCompare(b.descricao));
}

    rows.length?rows.map(l=>{const s=st(l);return `<tr><td class="num">${fmtD(l.venc)}${s==='baixado'?`<span class="sub">${l.tipo==='pagar'?'pago':'recebido'} ${fmtD(l.dataBaixa)}</span>`:''}</td>${showTipo?`<td><span class="${l.tipo==='pagar'?'out':'in'}">${l.tipo==='pagar'?'Despesa':'Receita'}</span></td>`:''}<td><b style="font-weight:500">${esc(l.descricao)}</b><span class="sub">${esc(pessoaNome(l))}${l.formaId?' · '+esc(formaNome(l)):''}</span></td><td>${esc(contaNome(l.contaId))}<span class="sub">${esc(nome('centros',l.centroId)||'Sem centro de custo')}</span></td><td class="num">${l.total>1?l.parcela+'/'+l.total:'—'}</td><td class="r num ${l.tipo==='pagar'?'out':'in'}">${brl(valorReal(l))}</td><td><span class="pill p-${s}">${stLabel(l)}</span></td><td><div class="rowact">${s==='baixado'?`<button class="btn sm" data-act="estorno" data-id="${l.id}">Estornar</button>`:`<button class="btn sm ${l.tipo==='pagar'?'out-b':'in-b'}" data-act="baixa" data-id="${l.id}">${l.tipo==='pagar'?'Pagar':'Receber'}</button>`}<button class="btn sm" data-act="edit" data-id="${l.id}">Editar</button><button class="btn sm danger" data-act="del" data-id="${l.id}" data-armed="0">Excluir</button></div></td></tr>`}).join(''):`<tr><td colspan="${showTipo?8:7}" class="muted" style="text-align:center;padding:28px">Nenhum lançamento com esses filtros.</td></tr>`
  }</tbody></table></div><div class="tot"><span>${rows.length} lançamento${rows.length===1?'':'s'}</span>${v!=='pagar'?`<span>Receitas <b class="num in">${brl(tin)}</b></span>`:''}${v!=='receber'?`<span>Despesas <b class="num out">${brl(tout)}</b></span>`:''}</div>`;
}

function fillPessoas(){
  const t=$('#l-tipo').value,need=t==='pagar'?'fornecedor':'cliente';
  $('#l-pessoa-list').innerHTML=S.fornecedores.filter(f=>f.tipo==='ambos'||f.tipo===need).map(f=>`<option value="${esc(f.nome)}"></option>`).join('');
}
function fillContas(sel){
  const t=$('#l-tipo').value;
  const cs=S.contas.filter(c=>c.tipo===(t==='pagar'?'despesa':'receita')).sort((a,b)=>(a.codigo||'').localeCompare(b.codigo||''));
  $('#l-conta').innerHTML=opt(cs,sel,c=>(c.codigo?c.codigo+' ':'')+c.nome,'Sem conta contábil');
}
function togglePago(){
  const n=$('#l-n')?parseInt($('#l-n').value)||1:1;
  $('#l-pagorow').hidden=n>1;
  $('#l-pagodet').hidden=!$('#l-pago').checked;
}
function prevParcelas(){
  const el=$('#l-prev');if(!el)return;
  const n=parseInt($('#l-n').value)||1,v=parseBR($('#l-valor').value),mode=$('#l-modo').value;
  if(n<=1||isNaN(v)){el.textContent=n>1?'Informe o valor para ver o resumo das parcelas.':'';return}
  const tot=mode==='total'?v:v*n;
  el.textContent=`${n} parcelas, total de ${brl(tot)}. Primeira parcela: ${brl(mode==='total'?splitCents(v,n)[0]:v)}.`;
}
async function saveForm(e){
  e.preventDefault();
  const id=e.target.dataset.id,tipo=$('#l-tipo').value;
  const v=parseBR($('#l-valor').value);
  if(isNaN(v)||v<=0){toast('Informe um valor maior que zero.');return}
  const base={tipo,descricao:$('#l-desc').value.trim(),pessoa:$('#l-pessoa').value.trim(),contaId:$('#l-conta').value,centroId:$('#l-centro').value,carteiraId:$('#l-carteira').value,formaId:$('#l-forma').value,obs:$('#l-obs').value.trim()};
  base.fornecedorId=await resolveForn(base.pessoa,tipo);
  if(base.fornecedorId)base.pessoa=nome('fornecedores',base.fornecedorId);
  const n=$('#l-n')?Math.max(1,parseInt($('#l-n').value)||1):1;
  const pago=$('#l-pago').checked&&n===1;
  const venc=$('#l-venc').value;
  if(id){
    const o=S.lanc.find(x=>x.id===id);
    const u=Object.assign({},o,base,{valor:v,venc});
    if(pago){u.status='baixado';u.dataBaixa=$('#l-dbaixa').value||today();const vb=parseBR($('#l-vbaixa').value);u.valorBaixa=isNaN(vb)?v:vb}
    else{u.status='aberto';delete u.dataBaixa;delete u.valorBaixa}
    await put('lanc',u);toast('Lançamento atualizado.');
  }else{
    const per=$('#l-per').value,mode=$('#l-modo').value;
    const vals=n===1?[v]:(mode==='total'?splitCents(v,n):Array(n).fill(v));
    const grupo=n>1?uid():'';
    const items=vals.map((val,i)=>{
      const it=Object.assign({id:uid()+i},base,{valor:val,venc:nextDate(venc,i,per),status:'aberto',grupo,parcela:i+1,total:n});
      if(pago){it.status='baixado';it.dataBaixa=$('#l-dbaixa').value||today();const vb=parseBR($('#l-vbaixa').value);it.valorBaixa=isNaN(vb)?val:vb}
      return it;
    });
    await putMany('lanc',items);toast(n>1?`${n} parcelas lançadas.`:'Lançamento salvo.');
  }
  closeModal();render();
}

/* ---------- Lembretes ---------- */
function openReminders(auto){
  const t=today(),lim=addDays(t,7);
  const mk=tipo=>{
    const all=S.lanc.filter(l=>l.tipo===tipo&&abertas(l)&&l.venc<=lim).sort((a,b)=>a.venc.localeCompare(b.venc));
    const g=[['Vencidas','out',all.filter(l=>l.venc<t)],['Vencem hoje','warn',all.filter(l=>l.venc===t)],['Próximos 7 dias','',all.filter(l=>l.venc>t)]];
    return {all,html:g.map(([n,c,arr])=>arr.length?`<div class="grp ${c}">${n} (${arr.length})</div>`+arr.map(l=>`<div class="li"><div class="d ${c}">${fmtD(l.venc).slice(0,5)}</div><div style="min-width:0"><div class="n">${esc(l.descricao)}</div><div class="s">${esc(pessoaNome(l))}${l.total>1?` · ${l.parcela}/${l.total}`:''}</div></div><div style="text-align:right"><div class="num ${tipo==='pagar'?'out':'in'}">${brl(l.valor)}</div><button class="btn sm" data-act="baixa" data-id="${l.id}" style="margin-top:4px">${tipo==='pagar'?'Pagar':'Receber'}</button></div></div>`).join(''):'').join('')||'<p class="hint">Nada vencendo nos próximos 7 dias.</p>'};
  };
  const p=mk('pagar'),r=mk('receber');
  if(auto&&!p.all.length&&!r.all.length)return;
  modal(`<div class="mh"><div><h2 style="font-size:20px">Lembretes de hoje, ${fmtD(t)}</h2><div class="hint">Contas vencidas, que vencem hoje e nos próximos 7 dias.</div></div><button type="button" class="x" data-act="close" aria-label="Fechar">×</button></div>
  <div class="mb"><div class="rem"><div><h3><span class="out">A pagar</span><span class="num">${brl(sum(p.all.map(l=>l.valor)))}</span></h3>${p.html}</div><div><h3><span class="in">A receber</span><span class="num">${brl(sum(r.all.map(l=>l.valor)))}</span></h3>${r.html}</div></div>
  <div class="mf"><button class="btn" data-act="go" data-v="pagar">Ver contas a pagar</button><button class="btn pri" data-act="close">Entendi</button></div></div>`,true);
}

/* ---------- Extrato e exportação ---------- */
function extratoData(){
  const {de,ate,modo}=EX;const rows=[];const LL=S.lanc.filter(l=>!EX.forma||l.formaId===EX.forma);
  LL.forEach(l=>{
    if(l.status==='baixado'){
      if(modo!=='prev'&&l.dataBaixa>=de&&l.dataBaixa<=ate)rows.push({data:l.dataBaixa,l,real:true,v:valorReal(l)});
    }else if(modo!=='real'&&l.venc>=de&&l.venc<=ate)rows.push({data:l.venc,l,real:false,v:l.valor});
  });
  rows.sort((a,b)=>a.data.localeCompare(b.data)||a.l.descricao.localeCompare(b.l.descricao));
  const T={recebido:0,pago:0,aReceber:0,aPagar:0};
  rows.forEach(r=>{const k=r.l.tipo==='receber'?(r.real?'recebido':'aReceber'):(r.real?'pago':'aPagar');T[k]+=r.v});
  return {rows,T};
}

  return {body,T,rows};

const MODOS={real:'Realizado (pago e recebido)',prev:'Previsto (a pagar e a receber)',ambos:'Realizado e previsto'};
async function saveFile(name,data){
  let dl=null;try{dl=await window.claude.use('downloads')}catch(e){}
  if(!dl){
    try{
      const blob=new Blob([data],{type:'application/octet-stream'});
      const u=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Arquivo gerado: '+name);
    }catch(e){toast('Não foi possível salvar o arquivo.')}
    return;
  }
  try{await dl.save({filename:name,data});toast('Arquivo pronto: '+name)}catch(e){if(!(e&&e.code==='cancelled'||e&&e.code==='declined'))toast('O arquivo não foi salvo.')}
}

     ${cs.length?cs.map(c=>row('contas',c,esc((c.codigo?c.codigo+' ':'')+c.nome),`<span class="${c.tipo==='receita'?'in':'out'}">${c.tipo==='receita'?'Receita':'Despesa'}</span>`)).join(''):'<p class="hint">Nenhuma conta cadastrada.</p>'}</div>
   <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Centros de custo</h2><button class="btn sm pri" data-act="cnew" data-col="centros">+ Centro</button></div>
     <p class="hint">Agrupam gastos por finalidade, como Casa, Carro ou Lazer.</p>
     ${S.centros.length?S.centros.map(c=>row('centros',c,esc(c.nome),nl(S.lanc.filter(l=>l.centroId===c.id).length))).join(''):'<p class="hint">Nenhum centro de custo cadastrado.</p>'}</div>
   <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Carteiras</h2><button class="btn sm pri" data-act="cnew" data-col="carteiras">+ Carteira</button></div>
     <p class="hint">Contas bancárias, dinheiro e cartões onde o dinheiro entra e sai.</p>
     ${S.carteiras.length?S.carteiras.map(c=>row('carteiras',c,esc(c.nome),esc(c.tipo||'')+' · saldo '+brl(saldoCarteira(c)))).join(''):'<p class="hint">Nenhuma carteira cadastrada.</p>'}</div>
   <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Fornecedores e clientes</h2><button class="btn sm pri" data-act="cnew" data-col="fornecedores">+ Cadastro</button></div>
     <p class="hint">Quem recebe seus pagamentos e quem paga você. Um nome novo digitado em um lançamento é cadastrado automaticamente.</p>
     ${fs.length?fs.map(f=>row('fornecedores',f,esc(f.nome),({fornecedor:'Fornecedor',cliente:'Cliente',ambos:'Fornecedor e cliente'}[f.tipo]||'')+' · '+nl(S.lanc.filter(l=>l.fornecedorId===f.id).length)+(f.obs?' · '+esc(f.obs):''))).join(''):'<p class="hint">Nenhum cadastro ainda.</p>'}</div>
   <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Formas de pagamento</h2><button class="btn sm pri" data-act="cnew" data-col="formas">+ Forma</button></div>
     <p class="hint">PIX, dinheiro, cartão, TED, cheque e outras. Aparecem nos lançamentos, nas baixas e no extrato.</p>
     ${fmz.length?fmz.map(f=>row('formas',f,esc(f.nome),nl(S.lanc.filter(l=>l.formaId===f.id).length))).join(''):'<p class="hint">Nenhuma forma cadastrada.</p>'}</div>
  </div>
  <div class="panel" style="margin-top:16px"><h2>Dados</h2><p class="hint">Faça uma cópia de segurança dos seus lançamentos e cadastros em um arquivo JSON, ou restaure uma cópia anterior. Restaurar substitui os dados atuais.</p>
   <div class="actions"><button class="btn" data-act="backup">Baixar backup (.json)</button><label class="btn" for="restore" style="cursor:pointer">Restaurar backup<input id="restore" type="file" accept="application/json,.json" hidden></label><button class="btn" data-act="sample">Carregar exemplos</button><button class="btn danger" data-act="rmsample" data-armed="0">Remover exemplos</button></div></div>`;
}
function openCad(col,id){
  const x=id?S[col].find(y=>y.id===id):{};
  const f={
   contas:`<div class="row2"><div class="fld"><label for="c-cod">Código</label><input id="c-cod" value="${esc(x.codigo||'')}" placeholder="2.01"></div><div class="fld"><label for="c-tipo">Tipo</label><select id="c-tipo"><option value="despesa" ${x.tipo==='despesa'?'selected':''}>Despesa</option><option value="receita" ${x.tipo==='receita'?'selected':''}>Receita</option></select></div></div><div class="fld"><label for="c-nome">Nome</label><input id="c-nome" required value="${esc(x.nome||'')}"></div>`,
   centros:`<div class="fld"><label for="c-nome">Nome</label><input id="c-nome" required value="${esc(x.nome||'')}"></div>`,
   carteiras:`<div class="fld"><label for="c-nome">Nome</label><input id="c-nome" required value="${esc(x.nome||'')}"></div><div class="row2"><div class="fld"><label for="c-tipo">Tipo</label><select id="c-tipo">${['Conta corrente','Poupança','Dinheiro','Cartão de crédito','Investimento'].map(t=>`<option ${x.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="fld"><label for="c-saldo">Saldo inicial (R$)</label><input id="c-saldo" inputmode="decimal" value="${String(x.saldoInicial||0).replace('.',',')}"></div></div>`,
   fornecedores:`<div class="fld"><label for="c-nome">Nome</label><input id="c-nome" required value="${esc(x.nome||'')}"></div><div class="row2"><div class="fld"><label for="c-tipo">Tipo</label><select id="c-tipo">${[['fornecedor','Fornecedor'],['cliente','Cliente'],['ambos','Fornecedor e cliente']].map(([v,t])=>`<option value="${v}" ${(x.tipo||'fornecedor')===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="fld"><label for="c-obs">Observação (opcional)</label><input id="c-obs" value="${esc(x.obs||'')}" placeholder="Ex.: contato, plano"></div></div>`,
   formas:`<div class="fld"><label for="c-nome">Nome</label><input id="c-nome" required value="${esc(x.nome||'')}"></div>`}[col];
  const tt={contas:['Nova','conta contábil'],centros:['Novo','centro de custo'],carteiras:['Nova','carteira'],fornecedores:['Novo','fornecedor ou cliente'],formas:['Nova','forma de pagamento']}[col];
  modal(`<form id="cf" data-col="${col}" data-id="${id||''}"><div class="mh"><h2>${id?'Editar':tt[0]} ${tt[1]}</h2><button type="button" class="x" data-act="close" aria-label="Fechar">×</button></div><div class="mb">${f}<div class="mf"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></div></form>`);
}
async function saveCad(e){
  e.preventDefault();const col=e.target.dataset.col,id=e.target.dataset.id;
  const o=id?S[col].find(x=>x.id===id):{id:uid()};
  const u=Object.assign({},o,{nome:$('#c-nome').value.trim()});
  if(col==='contas'){u.codigo=$('#c-cod').value.trim();u.tipo=$('#c-tipo').value}
  if(col==='carteiras'){u.tipo=$('#c-tipo').value;const s=parseBR($('#c-saldo').value);u.saldoInicial=isNaN(s)?0:s}
  if(col==='fornecedores'){u.tipo=$('#c-tipo').value;u.obs=$('#c-obs').value.trim()}
  await put(col,u);closeModal();render();toast('Cadastro salvo.');
}
async function setup(){
  const C=[['1.01','Salário','receita'],['1.02','Serviços e freelances','receita'],['1.03','Rendimentos','receita'],['1.04','Outras receitas','receita'],
   ['2.01','Moradia','despesa'],['2.02','Alimentação','despesa'],['2.03','Transporte','despesa'],['2.04','Saúde','despesa'],['2.05','Educação','despesa'],['2.06','Lazer','despesa'],['2.07','Contas de consumo','despesa'],['2.08','Impostos e taxas','despesa'],['2.09','Cartão de crédito','despesa'],['2.10','Outras despesas','despesa']];
  if(!S.contas.length)await putMany('contas',C.map(([codigo,nome,tipo],i)=>({id:uid()+'c'+i,codigo,nome,tipo})));
  if(!S.centros.length)await putMany('centros',['Casa','Família','Carro','Lazer','Saúde','Educação'].map((nome,i)=>({id:uid()+'t'+i,nome})));
  if(!S.carteiras.length)await putMany('carteiras',[['Conta corrente','Conta corrente'],['Dinheiro','Dinheiro'],['Cartão de crédito','Cartão de crédito']].map(([nome,tipo],i)=>({id:uid()+'w'+i,nome,tipo,saldoInicial:0})));
  await ensureDefaults();
}
async function sample(){
  await setup();
  const ct=n=>(S.contas.find(c=>c.nome===n)||{}).id||'',ce=n=>(S.centros.find(c=>c.nome===n)||{}).id||'',cw=S.carteiras[0]?S.carteiras[0].id:'';
  const t=today(),m0=monthOf(t)+'-';
  const fId=n=>(S.formas.find(f=>f.nome===n)||{}).id||'';
  const items=[];
  const add=(o)=>items.push(Object.assign({id:uid()+items.length,exemplo:true,status:'aberto',carteiraId:cw,formaId:o.tipo==='receber'?fId('PIX'):fId(['Boleto','PIX','Cartão de crédito','Dinheiro'][items.length%4]),grupo:'',parcela:1,total:1,obs:'Exemplo'},o));
  for(let i=-2;i<=2;i++){
    const m=shiftMonth(monthOf(t),i);const past=i<0;
    const mk=(o)=>add(Object.assign(o,past?{status:'baixado',dataBaixa:o.venc,valorBaixa:o.valor}:{}));
    mk({tipo:'receber',descricao:'Salário',pessoa:'Empresa (exemplo)',valor:5200,venc:m+'-05',contaId:ct('Salário'),centroId:ce('Família')});
    mk({tipo:'pagar',descricao:'Aluguel',pessoa:'Imobiliária (exemplo)',valor:1450,venc:m+'-10',contaId:ct('Moradia'),centroId:ce('Casa')});
    mk({tipo:'pagar',descricao:'Energia elétrica',pessoa:'Concessionária (exemplo)',valor:210+i*12,venc:m+'-15',contaId:ct('Contas de consumo'),centroId:ce('Casa')});
    mk({tipo:'pagar',descricao:'Internet',pessoa:'Provedor (exemplo)',valor:119.9,venc:m+'-20',contaId:ct('Contas de consumo'),centroId:ce('Casa')});
    mk({tipo:'pagar',descricao:'Supermercado',pessoa:'Mercado (exemplo)',valor:780+i*25,venc:m+'-08',contaId:ct('Alimentação'),centroId:ce('Família')});
    if(i%2===0)mk({tipo:'receber',descricao:'Serviço extra',pessoa:'Cliente (exemplo)',valor:650,venc:m+'-25',contaId:ct('Serviços e freelances'),centroId:ce('Família')});
  }
  const g=uid(),vals=splitCents(3000,6);
  vals.forEach((v,i)=>add({tipo:'pagar',descricao:'Geladeira (parcelado)',pessoa:'Loja (exemplo)',valor:v,venc:addMonths(addDays(t,3),i-1),contaId:ct('Moradia'),centroId:ce('Casa'),grupo:g,parcela:i+1,total:6,status:i<1?'baixado':'aberto',dataBaixa:i<1?addMonths(addDays(t,3),-1):undefined,valorBaixa:i<1?v:undefined}));
  add({tipo:'pagar',descricao:'Seguro do carro',pessoa:'Seguradora (exemplo)',valor:320,venc:addDays(t,-3),contaId:ct('Transporte'),centroId:ce('Carro')});
  add({tipo:'pagar',descricao:'Plano de saúde',pessoa:'Operadora (exemplo)',valor:540,venc:t,contaId:ct('Saúde'),centroId:ce('Saúde')});
  add({tipo:'receber',descricao:'Aluguel recebido',pessoa:'Inquilino (exemplo)',valor:900,venc:addDays(t,2),contaId:ct('Outras receitas'),centroId:ce('Casa')});
  add({tipo:'pagar',descricao:'Escola',pessoa:'Colégio (exemplo)',valor:1100,venc:addDays(t,5),contaId:ct('Educação'),centroId:ce('Educação')});
  items.forEach(i=>{Object.keys(i).forEach(k=>i[k]===undefined&&delete i[k])});
  await putMany('lanc',items);
  await syncFornecedores();
}

/* ---------- Roteamento e eventos ---------- */
function render(){
  renderNav();
  if(view==='dash')renderDash();else if(view==='pagar'||view==='receber'||view==='todos')renderLista(view);
  else if(view==='extrato')renderExtrato();else renderCad();
}
function go(v){view=v;render();window.scrollTo(0,0)}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');
  if(e.target.id==='ov'){closeModal();return}
  if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  const arm=(fn)=>{if(b.dataset.armed==='1'){fn()}else{b.dataset.armed='1';const o=b.textContent;b.textContent='Confirmar?';setTimeout(()=>{if(b.isConnected){b.dataset.armed='0';b.textContent=o}},3000)}};
  if(a==='tema')cycleTema();
  else if(a==='go'){closeModal();go(b.dataset.v)}
  else if(a==='close')closeModal();
  else if(a==='new')openForm(b.dataset.t);
  else if(a==='edit')openForm(null,id);
  else if(a==='baixa'){openBaixa(id)}
  else if(a==='estorno'){const l=S.lanc.find(x=>x.id===id);const u=Object.assign({},l,{status:'aberto'});delete u.dataBaixa;delete u.valorBaixa;await put('lanc',u);render();toast('Baixa estornada.')}
  else if(a==='del')arm(async()=>{const l=S.lanc.find(x=>x.id===id);const sib=l.grupo?S.lanc.filter(x=>x.grupo===l.grupo&&x.id!==id&&abertas(x)).length:0;await del('lanc',id);render();toast('Lançamento excluído.'+(sib?` Existem ${sib} parcelas em aberto na mesma série.`:''))});
  else if(a==='ftipo'){$('#l-tipo').value=b.dataset.v;document.querySelectorAll('[data-act="ftipo"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#l-pessoa-l').textContent=b.dataset.v==='pagar'?'Fornecedor':'Cliente / pagador';$('#l-pago-l').textContent=b.dataset.v==='pagar'?'Já foi pago':'Já foi recebido';fillContas('');fillPessoas()}
  else if(a==='dmv'){dm=shiftMonth(dm,parseInt(b.dataset.d));renderDash()}
  else if(a==='reminders')openReminders(false);
  else if(a==='clearf'){F[view]=Object.assign({},F[view],{status:view==='todos'?'todas':'abertas',mes:view==='todos'?monthOf(today()):'',q:'',centro:'',forma:'',tipo:''});renderLista(view)}
  else if(a==='xmodo'){EX.modo=b.dataset.v;renderExtrato()}
  else if(a==='pdf'){try{await saveFile(`extrato_${EX.de}_a_${EX.ate}.pdf`,exPDF())}catch(err){toast('Não foi possível gerar o PDF.')}}
  else if(a==='xlsx'){try{await saveFile(`extrato_${EX.de}_a_${EX.ate}.xlsx`,exXLSX())}catch(err){toast('Não foi possível gerar o Excel.')}}
  else if(a==='setup'){await setup();render();toast('Cadastros padrão criados.')}
  else if(a==='sample'){await sample();render();toast('Exemplos carregados. Remova quando quiser em Cadastros.')}
  else if(a==='rmsample')arm(async()=>{await del('lanc',S.lanc.filter(l=>l.exemplo).map(l=>l.id));const un=S.fornecedores.filter(f=>f.exemplo&&!usedBy('fornecedores',f.id)).map(f=>f.id);if(un.length)await del('fornecedores',un);render();toast('Exemplos removidos.')});
  else if(a==='cnew')openCad(b.dataset.col);
  else if(a==='cedit')openCad(b.dataset.col,id);
  else if(a==='cdel')arm(async()=>{const col=b.dataset.col;if(usedBy(col,id)){toast('Este cadastro está em uso em lançamentos e não pode ser excluído.');return}await del(col,id);render()});
  else if(a==='backup'){await saveFile(`casa-em-ordem-backup-${today()}.json`,JSON.stringify(S,null,1))}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='lf')saveForm(e);else if(e.target.id==='bf')saveBaixa(e);else if(e.target.id==='cf')saveCad(e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f){const [v,k]=t.dataset.f.split('.');F[v][k]=t.value;drawList(v)}
  else if(t.id==='x-de'||t.id==='x-ate'){const de=$('#x-de').value,ate=$('#x-ate').value;if(de&&ate){EX.de=de;EX.ate=ate;const y=document.activeElement.id;renderExtrato();const el=$('#'+y);if(el)el.focus()}}
  else if(t.id==='x-forma'){EX.forma=t.value;renderExtrato()}
  else if(t.id==='l-n'||t.id==='l-valor'||t.id==='l-modo'){prevParcelas();togglePago()}
  else if(t.id==='l-pago')togglePago();
});
document.addEventListener('change',async e=>{
  if(e.target.id==='l-pago')togglePago();
  if(e.target.id==='restore'&&e.target.files[0]){
    const r=new FileReader();
    r.onload=async()=>{
      try{
        const d=JSON.parse(r.result);
        if(!['contas','centros','carteiras','lanc'].every(c=>Array.isArray(d[c])))throw 0;
        for(const c of COLS){await del(c,S[c].map(x=>x.id));await putMany(c,d[c]||[])}
        await ensureDefaults();await syncFornecedores();render();toast('Backup restaurado.');
      }catch(err){toast('Arquivo de backup inválido.')}
    };
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

(async function init(){
  applyTema();
  render();
  await loadAll();
  await ensureDefaults();
  await syncFornecedores();
  render();
  openReminders(true);
})();
})();
</script>

</body></html>
